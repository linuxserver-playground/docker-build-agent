# The manifest for docker-build-agent. Schema: https://github.com/linuxserver-playground/builder/blob/main/schemas/image.schema.json
schema: 1
name: build-agent
kind: tool

summary: build-agent container image.

upstream:
  version:
    type: os

release:
  branch: main
  tag: latest
  channel: stable

build:
  base: alpine
  version_arg: BUILD_AGENT_RELEASE
  platforms:
  - amd64
  - arm64

test:
  enabled: false
  startup_timeout: 60
  env:
    TZ: US/Pacific

runtime: {}

docs:
  categories:
  - Internal
  custom_readme: |
    # linuxserver/build-agent

    Used as part of the LSIO build process. Not for public consumption.

    ## Running

    ```yml
    services:
      build-agent:
        image: lscr.io/linuxserver/build-agent:latest
        privileged: true
        container_name: build-agent
        environment:
          - TZ=London/Europe
          - 'PUBLIC_KEY=<jenkins public key>'
          - PUID=1000
          - PGID=1000
        volumes:
          - ./docker-data:/config
        ports:
          - 2222:2222
        restart: unless-stopped
    ```

    For x86_64 machines, run `docker run --rm --privileged ghcr.io/linuxserver/qemu-static --reset -p yes` on the host to enable qemu before bringing any build agent containers up.

    - { date: "21.10.26:", desc: "Add xmlstarlet and pandoc." }
